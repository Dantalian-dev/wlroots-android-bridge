name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK components
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$(find "$ANDROID_SDK/cmdline-tools" -maxdepth 2 -name sdkmanager | sort | tail -1)"
          echo "Using sdkmanager: $SM"
          echo "$(dirname "$SM")" >> "$GITHUB_PATH"
          export PATH="$(dirname "$SM"):$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108" "cmake;3.22.1"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: bridge-apk
          path: app/build/outputs/apk/debug/*.apk
